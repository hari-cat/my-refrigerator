spring:
  datasource:
    url: jdbc:mysql://localhost:3306/my_refrigerator?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true

    show-sql: true
  security:
    user:
      password: ${SECURITY_PASSWORD}

server:
  port: 8080